<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop All — WARCRAFTS Scale Models</title>
  <meta name="description" content="Browse scale models of fighter jets, warbirds, helicopters, drones and aircraft carriers.">
  <meta name="theme-color" content="#0a0c0e">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Home</a>/<span>Shop</span></div>
        <h1 class="h-display" id="shopTitle">The Collection</h1>
        <p id="shopSub">Every model in the arsenal.</p>
      </div>
    </section>

    <div class="shop-bar">
      <div class="wrap shop-bar-inner">
        <div class="chips" id="chips"></div>
        <label class="search">
          <span class="sr-only">Search models</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="field" id="q" type="search" placeholder="Search F-22, Tomcat…" autocomplete="off">
        </label>
      </div>
    </div>

    <section class="wrap" style="padding-bottom:100px">
      <div class="shop-meta">
        <span id="count"></span>
        <div class="toggle-group">
          <label class="sr-only" for="origin">Nation</label>
          <select class="field" id="origin"></select>
          <label class="sr-only" for="sort">Sort</label>
          <select class="field" id="sort">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
