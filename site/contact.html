<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — WARCRAFTS Scale Models</title>
  <meta name="description" content="Questions, custom requests or bulk orders — get in touch with WARCRAFTS Scale Models.">
  <meta name="theme-color" content="#0a0c0e">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Home</a>/<span>Contact</span></div>
        <h1 class="h-display">Open a channel</h1>
        <p>Questions about a model, a custom request (tanks, warships, satellites…) or a bulk / corporate gift order? We're listening.</p>
      </div>
    </section>

    <div class="wrap contact-grid">
      <div class="contact-cards">
        <a class="contact-card" id="cWa" target="_blank" rel="noopener">
          <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-1 1.2-.4.2-.7.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.6-2.1c-.2-.3 0-.5.1-.6l.5-.6.3-.5v-.5l-1-2.2c-.2-.6-.5-.5-.7-.5h-.6a1.1 1.1 0 0 0-.8.4 3.4 3.4 0 0 0-1 2.5 5.9 5.9 0 0 0 1.2 3.1 13.4 13.4 0 0 0 5.2 4.6c.7.3 1.3.5 1.7.6a4.2 4.2 0 0 0 1.9.1 3.1 3.1 0 0 0 2-1.4 2.5 2.5 0 0 0 .2-1.4c-.1-.2-.3-.3-.6-.4M12 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8m8.4-18.2A11.8 11.8 0 0 0 1.8 17.9L.1 24l6.3-1.6A11.8 11.8 0 0 0 12 23.8 11.8 11.8 0 0 0 20.4 3.6"/></svg></span>
          <div><span>WhatsApp · fastest</span><b id="cWaNum"></b></div>
        </a>
        <a class="contact-card" id="cMail">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/></svg></span>
          <div><span>Email</span><b id="cMailTxt"></b></div>
        </a>
        <a class="contact-card" id="cIg" target="_blank" rel="noopener">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg></span>
          <div><span>Instagram</span><b>See new arrivals first</b></div>
        </a>
      </div>

      <form class="form-card" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thank-you-contact.html">
        <input type="hidden" name="form-name" value="contact">
        <p class="hidden"><label>Don't fill this out: <input name="bot-field"></label></p>
        <h2>Send a message</h2>
        <div class="form-grid">
          <div class="input-group"><label for="cName">Name</label><input id="cName" name="name" required autocomplete="name"></div>
          <div class="input-group"><label for="cPhone">Phone / WhatsApp</label><input id="cPhone" name="phone" type="tel" autocomplete="tel"></div>
          <div class="input-group full"><label for="cEmail">Email</label><input id="cEmail" name="email" type="email" autocomplete="email"></div>
          <div class="input-group full"><label for="cTopic">Topic</label>
            <select id="cTopic" name="topic">
              <option>Question about a model</option>
              <option>Request a model we don't stock</option>
              <option>Bulk / corporate gift order</option>
              <option>Order support</option>
              <option>Other</option>
            </select>
          </div>
          <div class="input-group full"><label for="cMessage">Message</label><textarea id="cMessage" name="message" required></textarea></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:22px">Send message</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
